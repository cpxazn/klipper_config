[gcode_macro FILAMENT_RUNOUT]
description: Actions to take when runout triggers
gcode:
  {% if printer.virtual_sdcard.is_active == True %}
    {action_respond_info("RUNOUT: Filament runout")}
    M118 State: {printer.print_stats.state}
    M118 Message: {printer.print_stats.message}
    M118 Is Active: {printer.virtual_sdcard.is_active}
    M118 Progress: {printer.virtual_sdcard.progress}
    M118 File Position: {printer.virtual_sdcard.file_position}
    M118 Webhooks State: {printer.webhooks.state}
    M118 Webhooks State Message: {printer.webhooks.state_message}
    RUN_SHELL_COMMAND CMD=SEND_EMAIL_RUNOUT
    M600
  {% endif %}

[gcode_macro UNLOAD]
description: Unloads filament
gcode:
  {% set min_temp = params.MIN_TEMP|default(175)|int %}
  {% set hotend_preheat = params.HOTEND|default(printer.extruder.target if printer.extruder.target >= min_temp else 220)|int %}
  {% set length = params.LENGTH|default(150)|int %}
  {% set speed = params.SPEED|default(180)|int %}
  {% set purge = params.PURGE|default(5)|float %}
  {% set initial_pull = params.INITIAL_PULL|default(20)|float %}
  {% set purge_speed = params.PURGE_SPEED|default(120)|int %}
  {% set initial_speed = params.INITIAL_SPEED|default(120)|int %}
  {% set temp_window = params.TEMP_WINDOW|default(2)|int %}
  {% if hotend_preheat < min_temp %}
    {% set hotend_preheat = min_temp %}
  {% endif %}
  M118 Conditioning hotend to {hotend_preheat}
  M104 S{hotend_preheat}
  TEMPERATURE_WAIT SENSOR="extruder" MINIMUM={hotend_preheat - temp_window} MAXIMUM={hotend_preheat + temp_window}

  {% if initial_pull > length %}
    {% set initial_pull = length %}
  {% endif %}
  {% set final_pull = length - initial_pull %}
  M118 Unload
  SAVE_GCODE_STATE NAME=Filament_state
  G91
  G92 E0
  {% if purge > 0 %}
    G1 E{purge} F{purge_speed}
  {% endif %}
  {% if initial_pull > 0 %}
    G1 E-{initial_pull} F{initial_speed}
  {% endif %}
  {% if final_pull > 0 %}
    G1 E-{final_pull} F{speed}
  {% endif %}
  G90
  M118 Done
  RESTORE_GCODE_STATE NAME=Filament_state


[gcode_macro UNLOAD_AND_COOLDOWN]
description: Unloads filament and turns off the hotend afterward
gcode:
  UNLOAD {rawparams}
  M104 S0 ; Turn off hotend




[gcode_macro UNLOAD_50]
description: Unloads 50mm of filament
gcode:
  {% if printer.extruder.target < 175 %}
    {% set hotend_preheat = params.HOTEND|default(240)|int %}
    M118 Heating hotend to {hotend_preheat}
    M104 S{hotend_preheat}
    M109 S{hotend_preheat}
  {% else %}
    {% set target_temp = (printer.extruder.target)|int %}
    M118 Waiting for temp {target_temp}
    #M109 S{target_temp}
    TEMPERATURE_WAIT SENSOR="extruder" MINIMUM={target_temp}
  {% endif %}

  {% set speed = params.SPEED|default(300)|int %}
  M118 Unload 50
  SAVE_GCODE_STATE NAME=Filament_state
  G91
  G1 E-50 F{speed}
  G90
  M118 Done
  RESTORE_GCODE_STATE NAME=Filament_state

[gcode_macro LOAD]
description: Loads filament
gcode:
  {% if printer.extruder.target < 175 %}
    {% set hotend_preheat = params.HOTEND|default(240)|int %}
    M118 Heating hotend to {hotend_preheat}
    M104 S{hotend_preheat}
    M109 S{hotend_preheat}
  {% else %}
    {% set target_temp = (printer.extruder.target)|int %}
    M118 Waiting for temp {target_temp}
    #M109 S{target_temp}
    TEMPERATURE_WAIT SENSOR="extruder" MINIMUM={target_temp}
  {% endif %}

  {% set length = params.LENGTH|default(150)|int %}
  {% set speed = params.SPEED|default(300)|int %}
  M118 Load
  SAVE_GCODE_STATE NAME=Filament_state
  G91
  G1 E{length} F{speed}
  G90
  M118 Done
  RESTORE_GCODE_STATE NAME=Filament_state

[gcode_macro LOAD_AND_PREHEAT]
description: Loads filament then lowers hotend and bed to preheat/standby temperatures
gcode:
  {% set hotend_standby = params.HOTEND_STANDBY|default(125)|int %} ; Hotend temperature to drop to after loading
  {% set bed_standby = params.BED_STANDBY|default(55)|int %} ; Bed temperature to set after loading

  LOAD {rawparams} ; Load filament - blocks until extrusion is fully complete

  ; Extrusion is done, now safe to lower temperatures
  M118 Load complete, setting standby temperatures
  M104 S{hotend_standby} ; Lower hotend to standby temp (non-blocking)
  M140 S{bed_standby} ; Set bed to standby temp (non-blocking)
  M118 Hotend target: {hotend_standby}, Bed target: {bed_standby}

